name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install (without TabPFN, whose weights need a licence)
        run: |
          python -m pip install mujoco numpy scipy pandas scikit-learn xgboost matplotlib pillow imageio imageio-ffmpeg pytest ruff
          python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
