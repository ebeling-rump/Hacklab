# The bin pose is KNOWN here (slots are only defined for a known bin pose).
# Each colour has a requested slot in the BIN frame (origin = bin centre, x/y along the bin walls).
# A cube counts as placed only if its centre ends up within 4 cm of its slot.
name: slots
seed: 4
cubes:
  - {color: red,    xy: [0.40, -0.14], yaw: 0.1}
  - {color: green,  xy: [0.54,  0.00], yaw: -0.7}
  - {color: blue,   xy: [0.34,  0.08], yaw: 0.6}
  - {color: purple, xy: [0.58, -0.16], yaw: 1.2}
bin:
  xy: [0.40, 0.42]
  yaw: 0.5
  slots: {red: [-0.045, -0.045], green: [0.045, -0.045], blue: [-0.045, 0.045], purple: [0.045, 0.045]}
